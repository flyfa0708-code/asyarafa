<!DOCTYPE html>
<html>
<head>
    <title>Form Biodata Siswa</title>
</head>

<body>

<form>
    <table border="0">
        <tr>
            <th colspan="3">FORM BIODATA SISWA</th>
        </tr>

        <tr>
            <td>NIM</td>
            <td>:</td>
            <td><input type="text" name="nim"></td>
        </tr>

        <tr>
            <td>Nama Lengkap</td>
            <td>:</td>
            <td><input type="text" name="nama" size="35"></td>
        </tr>

        <tr>
            <td>Kelas</td>
            <td>:</td>
            <td>
                <select name="kelas">
                    <option>X</option>
                    <option>XI</option>
                    <option>XII</option>
                </select>
            </td>
        </tr>

        <tr>
            <td>Jurusan</td>
            <td>:</td>
            <td>
                <input type="radio" name="jurusan" value="ti">
                Teknik Informatika

                <input type="radio" name="jurusan" value="si">
                Sistem Informasi

                <input type="radio" name="jurusan" value="mi">
                Multimedia
            </td>
        </tr>

        <tr>
            <td>Tempat dan Tanggal Lahir</td>
            <td>:</td>
            <td>
                <input type="text" name="tempat">

                <select name="tanggal">
                    <option>Tanggal</option>
                    <option>1</option>
                    <option>2</option>
                    <option>3</option>
                    <option>4</option>
                    <option>5</option>
                    <option>6</option>
                    <option>7</option>
                    <option>8</option>
                    <option>9</option>
                    <option>10</option>
                    <option>11</option>
                    <option>12</option>
                    <option>13</option>
                    <option>14</option>
                    <option>15</option>
                    <option>16</option>
                    <option>17</option>
                    <option>18</option>
                    <option>19</option>
                    <option>20</option>
                    <option>21</option>
                    <option>22</option>
                    <option>23</option>
                    <option>24</option>
                    <option>25</option>
                    <option>26</option>
                    <option>27</option>
                    <option>28</option>
                    <option>29</option>
                    <option>30</option>
                    <option>31</option>
                </select>

                <select name="bulan">
                    <option>Bulan</option>
                    <option>Januari</option>
                    <option>Februari</option>
                    <option>Maret</option>
                    <option>April</option>
                    <option>Mei</option>
                    <option>Juni</option>
                    <option>Juli</option>
                    <option>Agustus</option>
                    <option>September</option>
                    <option>Oktober</option>
                    <option>November</option>
                    <option>Desember</option>
                </select>

                <select name="tahun">
                    <option>Tahun</option>
                    <option>2007</option>
                    <option>2008</option>
                    <option>2009</option>
                    <option>2010</option>
                    <option>2011</option>
                    <option>2012</option>
                </select>
            </td>
        </tr>

        <tr>
            <td>Jenis Kelamin</td>
            <td>:</td>
            <td>
                <input type="radio" name="jk" value="laki">
                Laki-laki

                <input type="radio" name="jk" value="perempuan">
                Perempuan
            </td>
        </tr>

        <tr>
            <td>Alamat</td>
            <td>:</td>
            <td>
                <input type="text" name="alamat" size="40">
            </td>
        </tr>

        <tr>
            <td>Email</td>
            <td>:</td>
            <td>
                <input type="text" name="email">
                @
                <select name="email">
                    <option>Gmail.com</option>
                    <option>Yahoo.com</option>
                    <option>Outlook.com</option>
                </select>
            </td>
        </tr>

        <tr>
            <td></td>
            <td></td>
            <td>
                <input type="submit" value="Submit">
                <input type="reset" value="Cancel">
            </td>
        </tr>

    </table>
</form>

</body>
</html>
