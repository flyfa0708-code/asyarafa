<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>latihan form 1</title>
</head>
<body>
    <p>INI YANG PERTAMA</p>
    <H1>FORM PENDAFTARAN</H1>

    <form>
        <h3>Data Siswa</h3>
          Nama : <input type="text" placeholder="Nama...">
          <br><br>
          Umur : <input type="number" placeholder="Umur...">
          <br><br>
          TTL : <input type="date" placeholder="Tempat Tanggal Lahir...">
          <br><br>
          Jenis Kelamin : <input type="text" placeholder="Jenis Kelamin...">
          <br><br>
          Alamat : <input type="textarea" placeholder="Alamat...">
          <br><br>
          Email : <input type="email" placeholder="Your Email...">
          <br><br>
    </form>
   

    <p>INI YANG KE DUA</p>

      <h3>Data Siswa</h3>
    <label for="nama">Nama Lengkap</label>
    <input type="text" id="nama" name="nama" placeholder="Nama lengkap...">
    <br><br>

    <label for="umur"> Umur</label>
    <input type="number" id="umur" name="umur" placeholder="Umur...">
    <br><br>

    <label for="TTL">TTL</label>
    <input type="date" id="TTL" name="TTL" placeholder="Tempat Tanggal Lahir...">
    <br><br>

    <label for="jenis kelamin">Jenis Kelamin</label>
    <input type="radio" name="jenis kelamin" value="laki laki"> laki laki
    <input type="radio" name="jenis kelamin" value="perempuan"> perempuan
    <br><br>

    <label for="alamat">Alamat</label>
    <input type="textarea" id="alamat" name="alamat" placeholder="Alamat...">
    <br><br>

    <label for="email">Email</label>
    <input type="email" id="email" name="email" placeholder="Your email...">
    <br><br>

</body>
</html>
